name: Release

# Builds Murmur for macOS (arm64 + x64) and Windows, ad-hoc signs the macOS
# bundles, and publishes a draft GitHub release with checksums plus ready-made
# Homebrew and Scoop manifests.
#
# Murmur is NOT notarized or Authenticode-signed — see docs/DISTRIBUTION.md for
# why, and what that costs users. The macOS ad-hoc signing step below is not
# optional: an unsigned arm64 bundle will not execute at all.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  # Gate the whole release on the same checks that guard a PR. A broken build
  # reaching 500 people is far more expensive than a slow release.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Build better-sqlite3 for the runner's node
        run: npm rebuild better-sqlite3
      - name: Quality checks
        run: npm run quality-check
      - name: Tests
        run: npm test
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
          REQUIRE_DB_TESTS: "1"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            script: build:mac:arm64
          # Intel Macs still exist in a mixed community; drop this leg when they don't.
          - os: macos-13
            platform: mac
            arch: x64
            script: build:mac:x64
          - os: windows-latest
            platform: win
            arch: x64
            script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Fetch platform sidecars
        run: npm run prebuild:${{ matrix.platform }}

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          # No Developer ID certificate: electron-builder must not try to
          # discover one, or the build fails looking for a keychain identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # electron-builder's `identity: null` SKIPS signing rather than signing
      # ad-hoc, and macOS refuses to execute an unsigned arm64 binary. Clearing
      # extended attributes first is required or codesign rejects the bundle
      # with "resource fork, Finder information, or similar detritus not allowed".
      - name: Ad-hoc sign the macOS bundle
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          APP=$(find dist -maxdepth 2 -name "Murmur.app" -type d | head -1)
          test -n "$APP" || { echo "::error::Murmur.app not found in dist/"; exit 1; }
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=1 "$APP"

      # The .zip electron-builder produced was made before ad-hoc signing, so it
      # contains the unsigned bundle. Repack it from the signed .app.
      - name: Repack the signed macOS zip
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          APP=$(find dist -maxdepth 2 -name "Murmur.app" -type d | head -1)
          OUT="dist/Murmur-${{ matrix.arch }}.zip"
          rm -f dist/*.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          for f in *.dmg *.zip *.exe; do
            if command -v shasum >/dev/null; then shasum -a 256 "$f" >> SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt
            else sha256sum "$f" >> SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt; fi
          done
          cat SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: murmur-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name 'SHA256SUMS-*.txt' \) \
            -exec cp {} release/ \;
          cat release/SHA256SUMS-*.txt > release/SHA256SUMS.txt
          rm -f release/SHA256SUMS-*-*.txt
          ls -la release

      # Package-manager manifests are generated here, where the real checksums
      # exist. Copy them into the tap/bucket repos after the release publishes.
      - name: Generate Homebrew cask and Scoop manifest
        run: node scripts/generate-package-manifests.js release "${{ github.ref_name }}"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
            release/murmur.rb
            release/murmur.json
